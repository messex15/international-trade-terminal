function contactsFromCSV(text){const rows=parseCSV(text.replace(/^\uFEFF/,''));if(rows.length<2)throw Error('The CSV has no contacts.');const headers=rows.shift().map(x=>x.trim().toLowerCase());const get=(row,...names)=>{for(const name of names){const i=headers.indexOf(name.toLowerCase());if(i>=0&&row[i]?.trim())return row[i].trim()}return ''};if(!headers.some(x=>['name','given name','first name','e-mail 1 - value','email 1 - value','email 1 - value','organization 1 - name','organization name'].includes(x)))throw Error('Choose a Google Contacts CSV export.');return rows.map(row=>({name:get(row,'Name')||[get(row,'Given Name','First Name'),get(row,'Family Name','Surname','Last Name')].filter(Boolean).join(' '),company:get(row,'Organization 1 - Name','Organization Name','Company'),email:get(row,'E-mail 1 - Value','Email 1 - Value','Email Address','Email'),phone:get(row,'Phone 1 - Value','Phone Number','Phone'),country:get(row,'Address 1 - Country','Country')})).filter(c=>c.name||c.company||c.email)}

 const search=document.querySelector('#pageSearch');if(search) search.oninput=e=>{query=e.target.value;const pos=e.target.selectionStart;render();const next=document.querySelector('#pageSearch');next.focus();next.setSelectionRange(pos,pos)};
 const select=document.querySelector('#pageFilter');if(select) select.onchange=e=>{filter=e.target.value;render()};
 const dialog=document.querySelector('#recordDialog');if(dialog){dialog.querySelector('[data-cancel]').onclick=()=>{editing=false;render()};dialog.querySelector('form').onsubmit=e=>{e.preventDefault();const row=data[active][0].map((_,i)=>String(new FormData(e.target).get(`field${i}`)||'').trim());data[active][1].push(row);save();editing=false;render()};const file=dialog.querySelector('#googleCsv');if(file)file.onchange=async e=>{const selected=e.target.files[0];if(!selected)return;try{if(!/\.csv$/i.test(selected.name)||selected.size>2*1024*1024)throw Error('Choose a Google CSV file smaller than 2 MB.');const contacts=contactsFromCSV(await selected.text());if(!contacts.length)throw Error('No usable contacts were found.');importedContacts=contacts;importMessage=`${contacts.length} contacts ready. Select one to fill the form.`}catch(err){importedContacts=[];importMessage=err.message}render();document.querySelector('#contactPicker')?.focus()};const picker=dialog.querySelector('#contactPicker');if(picker)picker.onchange=e=>{const contact=importedContacts[Number(e.target.value)];if(!contact)return;const values=active==='Buyers'?[contact.company||contact.name,contact.name,contact.country,'','New','',contact.email,contact.phone]:[contact.company||contact.name,contact.country,'','New','',contact.name,contact.email,contact.phone];values.forEach((value,i)=>{if(value)dialog.querySelector(`[name="field${i}"]`).value=value})}};
}render();
function recordDialog(){const importable=['Buyers','Suppliers'].includes(active);return `<div class="modalBackdrop"><div class="modal" id="recordDialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><h2 id="dialogTitle">Add ${escapeHTML(active)} record</h2><p>Saved only in this browser. This public prototype has no account sync.</p>${importable?`<div class="importBox"><label for="googleCsv">Import Google or Gmail contacts (Google CSV)</label><input id="googleCsv" type="file" accept=".csv,text/csv"><small>Export contacts as Google CSV from contacts.google.com. The file stays in this browser; select a contact to autofill one entry.</small>${importMessage?`<p role="status">${escapeHTML(importMessage)}</p>`:''}${importedContacts.length?`<label for="contactPicker">Autofill from contact</label><select id="contactPicker"><option value="">Choose a contact</option>${importedContacts.map((c,i)=>`<option value="${i}">${escapeHTML([c.name,c.company,c.email].filter(Boolean).join(' · '))}</option>`).join('')}</select>`:''}</div>`:''}<form>${data[active][0].map((h,i)=>`<label>${escapeHTML(h)}<input name="field${i}" ${i===0?'required':''} maxlength="150"></label>`).join('')}<div class="modalActions"><button type="button" class="ghost" data-cancel>Cancel</button><button type="submit">Save record</button></div></form></div></div>`}
</script></body></html>
