<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0d2238" />
<meta name="robots" content="noindex,nofollow" />
<title>AINU Business Command Centre</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:#091827}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 72% 18%,#173b5f 0,#0d2238 34%,#081725 72%);padding:24px}.gate{text-align:center;max-width:420px}.mark{width:52px;height:52px;margin:0 auto 16px;border:1px solid rgba(212,162,58,.65);border-radius:13px;display:grid;place-items:center;color:#d4a23a;font-size:28px}.gate h1{font-size:18px;letter-spacing:.06em;margin:0 0 8px}.gate p{margin:0;color:#9eb3c8;font-size:12px;line-height:1.55}
</style>
</head>
<body>
<main class="gate"><div class="mark">◎</div><h1>AINU BUSINESS COMMAND CENTRE</h1><p id="status">Checking access…</p></main>
<script type="module">
import { getUser } from 'https://esm.sh/@netlify/identity';

const status = document.getElementById('status');
const authHash = /^#(?:invite_token|confirmation_token|recovery_token|email_change_token|access_token)=/;
const validPageHashes = new Set([
  'Dashboard','Opportunities','Projects','Companies','Buyers','Suppliers','Contacts','Commodities',
  'Trade Leads','Market Intelligence','Tasks & Follow-ups','Meetings','Documents','Reports',
  'Partners & Referrals','Settings','Profile','Help & Support'
]);

function hasMemberRole(user){
  return Boolean(user && (user.roles?.includes?.('member') || user.app_metadata?.roles?.includes?.('member')));
}

async function boot(){
  // Default Netlify invitation/recovery links land on the project root. Move the
  // untouched token to the public login page before any protected app code loads.
  if (authHash.test(location.hash)) {
    location.replace('/login' + location.hash);
    return;
  }

  let requested = 'Dashboard';
  if (location.hash.length > 1) {
    try {
      const decoded = decodeURIComponent(location.hash.slice(1));
      if (validPageHashes.has(decoded)) requested = decoded;
    } catch {}
  }

  try {
    const user = await getUser();
    if (hasMemberRole(user)) {
      location.replace('/app/#' + encodeURIComponent(requested));
      return;
    }
    if (user) {
      status.textContent = 'Your account is signed in but does not have portal access yet.';
      setTimeout(() => location.replace('/login?role=missing'), 900);
      return;
    }
  } catch {}
  location.replace('/login');
}
boot();
</script>
</body>
</html>
