function table(headers,rows){return `<div class="tableWrap"><table><thead><tr>${headers.map(x=>`<th scope="col">${escapeHTML(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${escapeHTML(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function network(){const r=routes[selectedRoute];const hubs=[['VANCOUVER',157,175],['EDMONTON',181,151],['MUMBAI',681,287],['EAST ASIA',765,213],['MIDDLE EAST',582,255]];return `<div class="networkPage"><div class="networkTop"><div><small>OPERATIONS / NETWORK VIEW</small><h1>Trade Network</h1><p>Explore illustrative corridors linked to opportunity records.</p></div><div class="networkStatus"><span class="pulse"></span> DEMO MODE <b>${routes.length} corridors</b></div></div><div class="networkShell"><section class="networkMap" aria-label="Conceptual trade network map"><div class="mapTop"><strong>GLOBAL CORRIDORS <small>PLANNING VIEW</small></strong><span>NO LIVE FEEDS CONNECTED</span></div><svg viewBox="0 0 900 480" role="img" aria-label="Conceptual map with sample trade corridors from Western Canada to India, East Asia and the Middle East"><defs><pattern id="grid" width="45" height="40" patternUnits="userSpaceOnUse"><path d="M 45 0 L 0 0 0 40" fill="none" stroke="#243a50" stroke-width=".7"/></pattern><radialGradient id="glow"><stop stop-color="#31647a" stop-opacity=".45"/><stop offset="1" stop-color="#0a1828" stop-opacity="0"/></radialGradient></defs><rect width="900" height="480" fill="#0b1829"/><rect width="900" height="480" fill="url(#grid)"/><ellipse cx="485" cy="220" rx="380" ry="260" fill="url(#glow)"/><g class="landmass"><path d="M85 65l85-22 88 20 38 48-24 38-59 10-22 65-44 34-39-29-8-72-37-35z M210 266l50 20 44 60-12 73-43 34-27-48-30-61z M405 103l65-34 49 15 14 39 56 7 42-35 96 17 74 57-31 48-73 2-41 39-69-21-56 37-37-31-47 17-27-49-49-8z M485 270l83 8 34 57-25 90-53 17-42-66z M741 334l70-10 40 43-18 31-76-5z"/></g>${layers.routes?routes.map((route,i)=>`<path class="routePath ${selectedRoute===i?'chosen':''}" d="M${route.x1} ${route.y1} Q${(route.x1+route.x2)/2} ${Math.min(route.y1,route.y2)-105} ${route.x2} ${route.y2}" stroke="${route.color}"/>`).join(''):''}${layers.hubs?hubs.map(([label,x,y])=>`<g class="hub"><circle cx="${x}" cy="${y}" r="12"/><circle cx="${x}" cy="${y}" r="4"/>${layers.labels?`<text x="${x+15}" y="${y-12}">${label}</text>`:''}</g>`).join(''):''}</svg><div class="mapLegend"><span><i></i> Sample corridor</span><span>Conceptual display · positions approximate</span></div></section><div class="networkPanel"><div class="panelBlock"><small>DISPLAY LAYERS</small><h2>Map controls</h2><div class="layerControls">${Object.entries(layers).map(([key,on])=>`<button data-layer="${key}" aria-pressed="${on}">${key.toUpperCase()} <span>${on?'ON':'OFF'}</span></button>`).join('')}</div></div><div class="panelBlock"><small>SELECT A CORRIDOR</small><h2>Opportunity lanes</h2><div class="routeList">${routes.map((route,i)=>`<button data-route="${i}" class="${selectedRoute===i?'selected':''}" aria-pressed="${selectedRoute===i}"><span class="routeDot" style="background:${route.color}"></span><span><b>${escapeHTML(route.from)} → ${escapeHTML(route.to)}</b><small>${escapeHTML(route.product)}</small></span></button>`).join('')}</div></div><div class="routeDetail"><small>SELECTED OPPORTUNITY</small><h3>${escapeHTML(r.name)}</h3><p>${escapeHTML(r.from)} → ${escapeHTML(r.to)}</p><div><span>Stage</span><b>${escapeHTML(r.stage)}</b></div><button data-open-opportunity>View opportunity →</button></div></div></div><div class="networkFoot"><span>◉ Workspace data: browser demo</span><span>Routes illustrate possible lanes; no shipment tracking or transit estimates are connected.</span></div></div>`}
function dashboard(){const stages=['Identified','Contacted','In Discussion','Proposal Sent','Negotiation','Closed / Won'];return `<div class="pageHead"><div><h1>Business overview</h1><p>Illustrative records for exploring the prototype.</p></div><button data-add>+ Quick Add</button></div><div class="networkTeaser"><div><small>NEW WORKSPACE VIEW</small><b>Explore trade corridors</b><span>Inspect sample lanes, opportunity stages, and display layers in one place.</span></div><button data-network>Open Trade Network →</button></div><div class="stats">${[['Opportunities',count('Opportunities')],['Projects',count('Projects')],['Open follow-ups',count('Tasks & Follow-ups')],['Meetings',count('Meetings')],['Contacts',count('Contacts')]].map(s=>`<div class="stat"><small>${s[0]}</small><strong>${s[1]}</strong><em>Demo records</em></div>`).join('')}</div><div class="grid2"><section class="card"><h3>Opportunity stages</h3><div class="funnel">${stages.map(stage=>`<div><span>${stage}</span><b>${data.Opportunities[1].filter(row=>row[3]===stage).length}</b></div>`).join('')}</div></section><section class="card"><h3>Opportunities</h3>${data.Opportunities[1].slice(0,5).map(o=>`<div class="opp"><div><b>${escapeHTML(o[0])}</b><small>${escapeHTML(o[1])} · ${escapeHTML(o[2])}</small></div><span class="badge">${escapeHTML(o[3])}</span><strong>${escapeHTML(o[4])}</strong></div>`).join('')}</section></div><div class="grid3"><section class="card"><h3>Tasks</h3>${data['Tasks & Follow-ups'][1].slice(0,5).map(t=>`<div class="mini"><div><b>${escapeHTML(t[0])}</b><small>${escapeHTML(t[1])} · ${escapeHTML(t[3])}</small></div></div>`).join('')}</section><section class="card"><h3>Meetings</h3>${data.Meetings[1].slice(0,4).map(m=>`<div class="mini"><div><b>${escapeHTML(m[1])}</b><small>${escapeHTML(m[0])} · ${escapeHTML(m[4])}</small></div></div>`).join('')}</section><section class="card"><h3>About this prototype</h3><p>These records are examples. Additions are saved only in this browser. They are not shared with other users or synced to a server.</p></section></div>`}
function page(name){let [h]=data[name],rows=visibleRows(name);return `<div class="pageHead"><div><h1>${name}</h1><p>${rows.length} of ${count(name)} demo records shown · Saved in this browser only</p></div><button data-add>+ New Record</button></div><section class="card"><div class="toolbar"><label class="searchSmall"><span class="srOnly">Search ${name}</span><input id="pageSearch" placeholder="Search ${name.toLowerCase()}..." value="${escapeHTML(query)}"></label><label class="srOnly" for="pageFilter">Filter ${name}</label><select id="pageFilter" class="ghost"><option value="">All records</option>${[...new Set(data[name][1].flat())].filter(x=>typeof x==='string'&&x.length<35).map(x=>`<option value="${escapeHTML(x)}" ${filter===x?'selected':''}>${escapeHTML(x)}</option>`).join('')}</select></div>${rows.length?table(h,rows):'<p>No matching records.</p>'}</section>`}
function render(){document.getElementById('app').innerHTML=`<div class="app"><aside><div class="brand"><div class="mark">◎</div><div><b>AINU</b><small>BUSINESS COMMAND CENTRE</small></div></div><div class="units">AgriCan International Inc. | IrisTech</div><nav aria-label="Sections">${nav.map(n=>`<button class="${active===n?'active':''}" data-n="${n}" ${active===n?'aria-current="page"':''}><span aria-hidden="true">◈</span><span>${n}</span>${n==='Tasks & Follow-ups'?`<span class="count">${count(n)}</span>`:''}</button>`).join('')}</nav><div class="sideFoot"><button data-add>＋ Quick Add</button><small>Demo prototype · 2026</small></div></aside><main><header><button class="menuToggle" aria-label="Toggle sections" aria-expanded="false">☰ Menu</button><div class="location">📍 Edmonton, CAN</div><span class="demoLabel">DEMO · Browser-only data</span><div class="user"><div class="avatar">AA</div><div><b>Demo account</b><small>Prototype</small></div></div></header><div class="content">${active==='Dashboard'?dashboard():active==='Trade Network'?network():page(active)}</div></main></div>${editing?recordDialog():''}`;
 document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{active=b.dataset.n;query='';filter='';editing=false;document.body.classList.remove('menuOpen');render()});
 document.querySelector('.menuToggle').onclick=e=>{document.body.classList.toggle('menuOpen');e.currentTarget.setAttribute('aria-expanded',document.body.classList.contains('menuOpen'))};
 document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{if(active==='Dashboard') active='Opportunities';editing=true;render();document.querySelector('#recordDialog input')?.focus()});
 const networkLink=document.querySelector('[data-network]');if(networkLink)networkLink.onclick=()=>{active='Trade Network';render()};
 document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{selectedRoute=Number(b.dataset.route);render()});
 document.querySelectorAll('[data-layer]').forEach(b=>b.onclick=()=>{layers[b.dataset.layer]=!layers[b.dataset.layer];render()});
 const openOpportunity=document.querySelector('[data-open-opportunity]');if(openOpportunity)openOpportunity.onclick=()=>{active='Opportunities';query=routes[selectedRoute].name;filter='';render()};
 const search=document.querySelector('#pageSearch');if(search) search.oninput=e=>{query=e.target.value;const pos=e.target.selectionStart;render();const next=document.querySelector('#pageSearch');next.focus();next.setSelectionRange(pos,pos)};
 const select=document.querySelector('#pageFilter');if(select) select.onchange=e=>{filter=e.target.value;render()};
 const dialog=document.querySelector('#recordDialog');if(dialog){dialog.querySelector('[data-cancel]').onclick=()=>{editing=false;render()};dialog.querySelector('form').onsubmit=e=>{e.preventDefault();data[active][1].push([...new FormData(e.target).values()].map(x=>String(x).trim()));save();editing=false;render()}};
}render();
function recordDialog(){return `<div class="modalBackdrop"><div class="modal" id="recordDialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><h2 id="dialogTitle">Add ${escapeHTML(active)} record</h2><p>Saved only in this browser. Do not enter confidential information.</p><form>${data[active][0].map((h,i)=>`<label>${escapeHTML(h)}<input name="field${i}" required maxlength="150"></label>`).join('')}<div class="modalActions"><button type="button" class="ghost" data-cancel>Cancel</button><button type="submit">Save record</button></div></form></div></div>`}
</script></body></html>
