ackground:#10253f;color:#f5ba2b;display:grid;place-items:center;font-weight:800}.content{padding:24px}.pageHead{display:flex;justify-content:space-between;margin-bottom:18px}.pageHead h1{margin:0 0 4px;font-size:25px}.pageHead p{margin:0;color:#728096;font-size:12px}.pageHead button{background:#0c72d9;color:#fff;border:0;border-radius:6px;padding:10px 14px;font-weight:600}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}.stat{background:#fff;border:1px solid #e0e7ef;border-radius:8px;padding:15px;box-shadow:0 2px 10px #15365c0b}.stat small{display:block;color:#738096;font-size:9px;text-transform:uppercase}.stat strong{display:block;font-size:23px;margin:2px 0}.stat em{font-size:9px;color:#3d7ec0;font-style:normal}.grid2{display:grid;grid-template-columns:1fr 1.2fr;gap:14px;margin-bottom:14px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}.card{background:#fff;border:1px solid #dfe6ee;border-radius:8px;padding:16px;box-shadow:0 2px 10px #17355c0a}.card h3{font-size:12px;text-transform:uppercase;margin:0 0 14px}.funnel{display:flex;flex-direction:column;align-items:center;gap:3px}.funnel div{height:39px;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#0b2e58;clip-path:polygon(4% 0,96% 0,90% 100%,10% 100%);font-size:11px}.funnel div:nth-child(2){background:#15539a}.funnel div:nth-child(3){background:#de9414}.funnel div:nth-child(4){background:#2d9b63}.funnel div:nth-child(5){background:#5f57a5}.funnel div:nth-child(6){background:#1f7b51}.opp,.mini{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #eef2f6}.opp>div,.mini>div{min-width:0;flex:1}.opp b,.mini b{font-size:11px;display:block}.opp small,.mini small{font-size:9px;color:#77869a;display:block;margin-top:2px}.opp strong{font-size:11px;color:#19915b}.badge{background:#eef4ff;border:1px solid #d4e3ff;border-radius:5px;padding:4px 7px;color:#446a98;font-size:9px}.toolbar{display:flex;just
