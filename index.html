function supplierPage(){const entries=supplierRows(),all=geoItems().filter(x=>x.name==='Suppliers'),mapped=entries.map(x=>all.find(item=>item.record===x.i)).filter(Boolean),selected=data.Suppliers[1][selectedSupplier],h=data.Suppliers[0];const detail=selected?`<span class="detailTag">${escapeHTML(selected[3]||'Unclassified')}</span><h2>${escapeHTML(selected[0])}</h2><p>${escapeHTML(selected[1]||'Location not recorded')}</p><dl class="detailGrid">${['Products','Contact','Email','Phone',...supplierExtra,'Latitude','Longitude'].map(field=>`<dt>${escapeHTML(field)}</dt><dd>${escapeHTML(selected[h.indexOf(field)]||'Not recorded')}</dd>`).join('')}</dl><div class="detailNote"><b>Notes</b><p>${escapeHTML(selected[4]||'No notes yet.')}</p><small>Map point is an approximate regional centre unless you enter verified coordinates for a facility. Values in this prototype are demo records.</small></div><div class="routeTools"><button class="geoAction" data-edit-supplier>Edit supplier</button><button class="geoAction" data-show-map="Suppliers-${selectedSupplier}">View on map →</button></div>`:'<p>Select a supplier.</p>';return `<div class="geoPage"><div class="geoHead"><div><small>TRADE INTELLIGENCE / PARTNERS</small><h1>Suppliers</h1><p>Explore products, relationships, location coverage, and missing supplier details.</p></div><button data-add>＋ Add supplier</button></div><div class="geoStats"><div class="geoStat"><small>SUPPLIER RECORDS</small><strong>${count('Suppliers')}</strong><span>Browser demo</span></div><div class="geoStat"><small>ON MAP</small><strong>${all.length}</strong><span>Approximate locations</span></div><div class="geoStat"><small>PRODUCT TYPES</small><strong>${new Set(data.Suppliers[1].flatMap(r=>r[2].split(',').map(x=>x.trim()).filter(Boolean))).size}</strong><span>Listed across records</span></div><div class="geoStat"><small>DETAILS TO CONFIRM</small><strong>${data.Suppliers[1].filter(r=>!r[idx('Suppliers','Capacity (MT/year)')]||!r[idx('Suppliers','Certifications')]).length}</strong><span>Capacity or certification missing</span></div></div><div class="supplierWorkspace"><div class="supplierMain"><section class="geoCard"><h2>Supplier locations</h2><div class="geoMap"><span class="geoMapBadge">WESTERN CANADA · REGIONAL VIEW</span><svg viewBox="205 60 155 105" role="img" aria-label="Approximate supplier locations in Western Canada"><rect x="205" y="60" width="155" height="105" fill="#0b1829"/><path d="${landPath}" fill="#17394a" stroke="#416b77" stroke-width=".5"/><path d="M265 75v85 M298 75v85 M328 75v85 M210 100h145 M210 125h145" fill="none" stroke="#375669" stroke-width=".3" stroke-dasharray="2 2"/><text x="268" y="86" fill="#97b5bf" font-size="5">ALBERTA</text><text x="300" y="86" fill="#97b5bf" font-size="5">SASKATCHEWAN</text><text x="330" y="86" fill="#97b5bf" font-size="5">MANITOBA</text>${geoMarkers(mapped,'supplier')}</svg></div><p class="geoHint">Regional markers are approximate. Add verified latitude and longitude to place a specific facility.</p>${geoFilterMarkup(all,'supplier')}<label class="srOnly" for="pageSearch">Search suppliers</label><input id="pageSearch" class="geoSearch" placeholder="Search company, product, notes, or contact…" value="${escapeHTML(query)}"><div class="supplierList">${entries.length?entries.map(({row,i})=>`<button class="supplierRow ${i===selectedSupplier?'selected':''}" data-supplier="${i}" aria-pressed="${i===selectedSupplier}"><span><b>${escapeHTML(row[0])}</b><small>${escapeHTML(row[1]||'Location unknown')}</small></span><span>${escapeHTML(row[2]||'No products')}</span><span><em>${escapeHTML(row[3]||'New')}</em></span><span>${row[idx('Suppliers','Latitude')]?'● On map':'○ Unmapped'}</span></button>`).join(''):'<p class="geoEmpty">No suppliers match these filters.</p>'}</div><p class="geoHint">Showing ${entries.length} of ${count('Suppliers')} suppliers</p></section></div><section class="geoCard supplierDetail" aria-live="polite">${detail}</section></div></div>`}
function networkGeoPanel(){const items=visibleGeo(),selected=geoItems().find(x=>x.key===selectedGeoKey);return `<section class="geoCard networkGeo"><h2>Located records <small>(${items.length})</small></h2><p class="geoHint">Select a point on the map or a record below. Approximate demo coordinates are not verified facility addresses.</p>${geoFilterMarkup(geoItems(),'network')}<div class="geoResults">${items.length?items.map(item=>`<button class="geoResult" data-geo="${escapeHTML(item.key)}">${escapeHTML(item.title)}<small>${escapeHTML(item.name)} · ${escapeHTML(item.location)}</small></button>`).join(''):'<p class="geoEmpty">No located records match.</p>'}</div>${selected?`<p class="geoHint">Selected: <b>${escapeHTML(selected.title)}</b> · ${escapeHTML(selected.location)} · <button class="geoLink" data-open-geo="${escapeHTML(selected.key)}">Open ${escapeHTML(selected.name)} →</button></p>`:''}</section>`}
const escapeHTML=value=>String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const save=()=>localStorage.setItem('ainu-demo-records',JSON.stringify(Object.fromEntries(Object.entries(data).map(([name,[,rows]])=>[name,rows]))));
const count=name=>data[name][1].length;
function visibleRows(name){return data[name][1].filter(row=>(!query||row.some(cell=>String(cell).toLowerCase().includes(query.toLowerCase())))&&(!filter||row.includes(filter)))}
function parseCSV(text){const rows=[];let row=[],field='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i];if(quoted){if(ch==='"'&&text[i+1]==='"'){field+='"';i++}else if(ch==='"')quoted=false;else field+=ch}else if(ch==='"')quoted=true;else if(ch===','){row.push(field);field=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()))rows.push(row);row=[];field=''}else field+=ch}if(quoted)throw Error('The CSV has an unfinished quoted field.');row.push(field);if(row.some(x=>x.trim()))rows.push(row);return rows}
function contactsFromCSV(text){const rows=parseCSV(text.replace(/^\uFEFF/,''));if(rows.length<2)throw Error('The CSV has no contacts.');const headers=rows.shift().map(x=>x.trim().toLowerCase());const get=(row,...names)=>{for(const name of names){const i=headers.indexOf(name.toLowerCase());if(i>=0&&row[i]?.trim())return row[i].trim()}return ''};if(!headers.some(x=>['name','given name','first name','e-mail 1 - value','email 1 - value','email 1 - value','organization 1 - name','organization name'].includes(x)))throw Error('Choose a Google Contacts CSV export.');return rows.map(row=>({name:get(row,'Name')||[get(row,'Given Name','First Name'),get(row,'Family Name','Surname','Last Name')].filter(Boolean).join(' '),company:get(row,'Organization 1 - Name','Organization Name','Company'),email:get(row,'E-mail 1 - Value','Email 1 - Value','Email Address','Email'),phone:get(row,'Phone 1 - Value','Phone Number','Phone'),country:get(row,'Address 1 - Country','Country')})).filter(c=>c.name||c.company||c.email)}
function table(headers,rows){return `<div class="tableWrap"><table><thead><tr>${headers.map(x=>`<th scope="col">${escapeHTML(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${escapeHTML(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function network(){const r=routes[selectedRoute];const stages=['Identified','Contacted','In Discussion','Proposal Sent','Negotiation','Closed / Won'];const progress=Math.max(1,stages.findIndex(x=>x.toLowerCase()===r.stage.toLowerCase())+1);const hubs=[['VANCOUVER',248,109],['EDMONTON',280,99],['MUMBAI',622,189],['EAST ASIA',712,157],['MIDDLE EAST',573,173]];return `<div class="networkPage"><div class="networkTop"><div><small>OPERATIONS / NETWORK VIEW</small><h1>Trade Network</h1><p>Explore illustrative corridors linked to opportunity records.</p></div><div class="networkStatus"><span class="pulse"></span> DEMO MODE <b>${routes.length} corridors</b></div></div><div class="networkShell"><section class="networkMap" aria-label="Conceptual trade network map"><div class="mapTop"><strong>GLOBAL CORRIDORS <small>PLANNING VIEW</small></strong><span>NO LIVE FEEDS CONNECTED</span></div><svg viewBox="0 0 900 480" role="img" aria-label="Equal-area world map with sample trade corridors from Western Canada to India, East Asia and the Middle East"><defs><pattern id="grid" width="45" height="40" patternUnits="userSpaceOnUse"><path d="M 45 0 L 0 0 0 40" fill="none" stroke="#243a50" stroke-width=".7"/></pattern><radialGradient id="glow"><stop stop-color="#31647a" stop-opacity=".45"/><stop offset="1" stop-color="#0a1828" stop-opacity="0"/></radialGradient></defs><rect width="900" height="480" fill="#0b1829"/><rect width="900" height="480" fill="url(#grid)"/><ellipse cx="485" cy="220" rx="380" ry="260" fill="url(#glow)"/><g class="landmass"><path d="${landPath}"/></g>${layers.routes?routes.map((route,i)=>`<path class="routePath ${selectedRoute===i?'chosen':''}" data-map-route="${i}" tabindex="0" role="button" aria-label="Select ${escapeHTML(route.name)} corridor" d="M${route.x1} ${route.y1} Q${(route.x1+route.x2)/2} ${Math.min(route.y1,route.y2)-45} ${route.x2} ${route.y2}" stroke="${route.color}"/>`).join(''):''}${layers.hubs?hubs.map(([label,x,y])=>`<g class="hub"><circle cx="${x}" cy="${y}" r="12"/><circle cx="${x}" cy="${y}" r="4"/>${layers.labels?`<text x="${label==='VANCOUVER'?x-14:x+15}" y="${label==='VANCOUVER'?y+28:y-12}" text-anchor="${label==='VANCOUVER'?'end':'start'}">${label}</text>`:''}</g>`).join(''):''}${geoMarkers(visibleGeo(),'network')}</svg><div class="mapLegend"><span><i></i> Select a route on the map</span><span>Natural Earth coastline · equal-area projection · route positions approximate</span></div></section><div class="networkPanel"><div class="panelBlock"><small>DISPLAY LAYERS</small><h2>Map controls</h2><div class="layerControls">${Object.entries(layers).map(([key,on])=>`<button data-layer="${key}" aria-pressed="${on}">${key.toUpperCase()} <span>${on?'ON':'OFF'}</span></button>`).join('')}</div></div><div class="panelBlock"><small>SELECT A CORRIDOR</small><h2>Opportunity lanes</h2><div class="routeList">${routes.map((route,i)=>`<button data-route="${i}" class="${selectedRoute===i?'selected':''}" aria-pressed="${selectedRoute===i}"><span class="routeDot" style="background:${route.color}"></span><span><b>${escapeHTML(route.from)} → ${escapeHTML(route.to)}</b><small>${escapeHTML(route.product)}</small></span></button>`).join('')}</div></div><div class="routeDetail" aria-live="polite"><small>SELECTED OPPORTUNITY</small><h3>${escapeHTML(r.name)}</h3><p>${escapeHTML(r.from)} → ${escapeHTML(r.to)}</p><div><span>Stage</span><b>${escapeHTML(r.stage)}</b></div><div class="routeProgress" aria-label="Stage ${progress} of ${stages.length}">${stages.map((_,i)=>`<span class="${i<progress?'done':''}"></span>`).join('')}</div><small class="routeHint">${progress} of ${stages.length} opportunity stages</small><div class="routeTools"><button data-cycle="-1" aria-label="Previous corridor">← Previous</button><button data-cycle="1" aria-label="Next corridor">Next →</button></div><button data-open-opportunity>View opportunity →</button></div></div></div>${networkGeoPanel()}<div class="networkFoot"><span>◉ Workspace data: browser demo</span><span>Routes illustrate possible lanes; no shipment tracking or transit estimates are connected.</span></div></div>`}
function dashboard(){const stages=['Identified','Contacted','In Discussion','Proposal Sent','Negotiation','Closed / Won'];return `<div class="pageHead"><div><h1>Business overview</h1><p>Illustrative records for exploring the prototype.</p></div><button data-add>+ Quick Add</button></div><div class="networkTeaser"><div><small>NEW WORKSPACE VIEW</small><b>Explore trade corridors</b><span>Inspect sample lanes, opportunity stages, and display layers in one place.</span></div><button data-network>Open Trade Network →</button></div><div class="stats">${[['Opportunities',count('Opportunities')],['Projects',count('Projects')],['Open follow-ups',count('Tasks & Follow-ups')],['Meetings',count('Meetings')],['Contacts',count('Contacts')]].map(s=>`<div class="stat"><small>${s[0]}</small><strong>${s[1]}</strong><em>Demo records</em></div>`).join('')}</div><div class="grid2"><section class="card"><h3>Opportunity stages</h3><div class="funnel">${stages.map(stage=>`<div><span>${stage}</span><b>${data.Opportunities[1].filter(row=>row[3]===stage).length}</b></div>`).join('')}</div></section><section class="card"><h3>Opportunities</h3>${data.Opportunities[1].slice(0,5).map(o=>`<div class="opp"><div><b>${escapeHTML(o[0])}</b><small>${escapeHTML(o[1])} · ${escapeHTML(o[2])}</small></div><span class="badge">${escapeHTML(o[3])}</span><strong>${escapeHTML(o[4])}</strong></div>`).join('')}</section></div><div class="grid3"><section class="card"><h3>Tasks</h3>${data['Tasks & Follow-ups'][1].slice(0,5).map(t=>`<div class="mini"><div><b>${escapeHTML(t[0])}</b><small>${escapeHTML(t[1])} · ${escapeHTML(t[3])}</small></div></div>`).join('')}</section><section class="card"><h3>Meetings</h3>${data.Meetings[1].slice(0,4).map(m=>`<div class="mini"><div><b>${escapeHTML(m[1])}</b><small>${escapeHTML(m[0])} · ${escapeHTML(m[4])}</small></div></div>`).join('')}</section><section class="card"><h3>About this prototype</h3><p>These records are examples. Additions are saved only in this browser. They are not shared with other users or synced to a server.</p></section></div>`}
function page(name){let [h]=data[name],rows=visibleRows(name);return `<div class="pageHead"><div><h1>${name}</h1><p>${rows.length} of ${count(name)} demo records shown · Saved in this browser only</p></div><button data-add>+ New Record</button></div><section class="card"><div class="toolbar"><label class="searchSmall"><span class="srOnly">Search ${name}</span><input id="pageSearch" placeholder="Search ${name.toLowerCase()}..." value="${escapeHTML(query)}"></label><label class="srOnly" for="pageFilter">Filter ${name}</label><select id="pageFilter" class="ghost"><option value="">All records</option>${[...new Set(data[name][1].flat())].filter(x=>typeof x==='string'&&x.length<35).map(x=>`<option value="${escapeHTML(x)}" ${filter===x?'selected':''}>${escapeHTML(x)}</option>`).join('')}</select></div>${rows.length?table(h,rows):'<p>No matching records.</p>'}</section>`}
function render(){document.getElementById('app').innerHTML=`<div class="app"><aside><div class="brand"><div class="mark">◎</div><div><b>AINU</b><small>BUSINESS COMMAND CENTRE</small></div></div><div class="units">AgriCan International Inc. | IrisTech</div><nav aria-label="Sections">${nav.map(n=>`<button class="${active===n?'active':''}" data-n="${n}" ${active===n?'aria-current="page"':''}><span aria-hidden="true">◈</span><span>${n}</span>${n==='Tasks & Follow-ups'?`<span class="count">${count(n)}</span>`:''}</button>`).join('')}</nav><div class="sideFoot"><button data-add>＋ Quick Add</button><small>Demo prototype · 2026</small></div></aside><main><header><button class="menuToggle" aria-label="Toggle sections" aria-expanded="false">☰ Menu</button><div class="location">📍 Edmonton, CAN</div><span class="demoLabel">DEMO · Browser-only data</span><div class="user"><div class="avatar">AA</div><div><b>Demo account</b><small>Prototype</small></div></div></header><div class="content">${active==='Dashboard'?dashboard():active==='Trade Network'?network():active==='Suppliers'?supplierPage():page(active)}</div></main></div>${editing?recordDialog():''}${toast?`<div class="toast" role="status">${escapeHTML(toast)}</div>`:''}`;
 document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{active=b.dataset.n;query='';filter='';editing=false;document.body.classList.remove('menuOpen');render()});
 document.querySelector('.menuToggle').onclick=e=>{document.body.classList.toggle('menuOpen');e.currentTarget.setAttribute('aria-expanded',document.body.classList.contains('menuOpen'))};
 document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{if(active==='Dashboard'||active==='Trade Network') active='Opportunities';editRecordIndex=-1;editing=true;render();document.querySelector('#recordDialog input')?.focus()});
 document.querySelectorAll('[data-edit-supplier]').forEach(el=>el.onclick=()=>{active='Suppliers';editRecordIndex=selectedSupplier;editing=true;render()});
 document.querySelectorAll('[data-supplier]').forEach(b=>b.onclick=()=>{selectedSupplier=Number(b.dataset.supplier);render()});
 document.querySelectorAll('[data-geo-filter]').forEach(el=>el.onchange=e=>{const key=e.target.dataset.geoFilter,value=e.target.value;if(key==='product')supplierProduct=value;if(key==='status')supplierStatus=value;if(key==='supplierRegion')supplierRegion=value;if(key==='type')mapType=value;if(key==='region')mapRegion=value;render()});
 const geoSearch=document.querySelector('[data-geo-search]');if(geoSearch)geoSearch.oninput=e=>{mapQuery=e.target.value;const pos=e.target.selectionStart;render();const next=document.querySelector('[data-geo-search]');next.focus();next.setSelectionRange(pos,pos)};
 document.querySelectorAll('[data-geo]').forEach(el=>{const selectGeo=()=>{selectedGeoKey=el.dataset.geo;const match=geoItems().find(x=>x.key===selectedGeoKey);if(active==='Suppliers'&&match)selectedSupplier=match.record;render()};el.onclick=selectGeo;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectGeo()}}});
 document.querySelectorAll('[data-show-map]').forEach(el=>el.onclick=()=>{selectedGeoKey=el.dataset.showMap;active='Trade Network';mapType='Suppliers';mapRegion='';mapQuery='';render()});
 document.querySelectorAll('[data-open-geo]').forEach(el=>el.onclick=()=>{const match=geoItems().find(x=>x.key===el.dataset.openGeo);if(!match)return;active=match.name;query=match.name==='Suppliers'?'':match.title;filter='';if(match.name==='Suppliers')selectedSupplier=match.record;render()});
 const networkLink=document.querySelector('[data-network]');if(networkLink)networkLink.onclick=()=>{active='Trade Network';render()};
 document.querySelectorAll('[data-route],[data-map-route]').forEach(b=>{const selectRoute=()=>{selectedRoute=Number(b.dataset.route??b.dataset.mapRoute);render()};b.onclick=selectRoute;if(b.hasAttribute('data-map-route'))b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectRoute()}}});
 document.querySelectorAll('[data-cycle]').forEach(b=>b.onclick=()=>{selectedRoute=(selectedRoute+Number(b.dataset.cycle)+routes.length)%routes.length;render()});
 document.querySelectorAll('[data-layer]').forEach(b=>b.onclick=()=>{layers[b.dataset.layer]=!layers[b.dataset.layer];render()});
 const openOpportunity=document.querySelector('[data-open-opportunity]');if(openOpportunity)openOpportunity.onclick=()=>{active='Opportunities';query=routes[selectedRoute].name;filter='';render()};
 const search=document.querySelector('#pageSearch');if(search) search.oninput=e=>{query=e.target.value;const pos=e.target.selectionStart;render();const next=document.querySelector('#pageSearch');next.focus();next.setSelectionRange(pos,pos)};
 const select=document.querySelector('#pageFilter');if(select) select.onchange=e=>{filter=e.target.value;render()};
 const dialog=document.querySelector('#recordDialog');if(dialog){dialog.querySelector('[data-cancel]').onclick=()=>{editing=false;editRecordIndex=-1;render()};dialog.querySelector('form').onsubmit=e=>{e.preventDefault();const row=data[active][0].map((_,i)=>String(new FormData(e.target).get(`field${i}`)||'').trim());applyGeoDefaults(active,row);if(editRecordIndex>=0){data[active][1][editRecordIndex]=row}else{data[active][1].push(row);if(active==='Suppliers')selectedSupplier=data.Suppliers[1].length-1}save();editRecordIndex=-1;editing=false;toast=`${active} record saved in this browser`;render();clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toast='';document.querySelector('.toast')?.remove()},4500)};const file=dialog.querySelector('#googleCsv');if(file)file.onchange=async e=>{const selected=e.target.files[0];if(!selected)return;try{if(!/\.csv$/i.test(selected.name)||selected.size>2*1024*1024)throw Error('Choose a Google CSV file smaller than 2 MB.');const contacts=contactsFromCSV(await selected.text());if(!contacts.length)throw Error('No usable contacts were found.');importedContacts=contacts;importMessage=`${contacts.length} contacts ready. Select one to fill the form.`}catch(err){importedContacts=[];importMessage=err.message}render();document.querySelector('#contactPicker')?.focus()};const picker=dialog.querySelector('#contactPicker');if(picker)picker.onchange=e=>{if(e.target.value==='')return;const contact=importedContacts[Number(e.target.value)];if(!contact)return;const values=active==='Buyers'?[contact.company||contact.name,contact.name,contact.country,'','New','',contact.email,contact.phone]:[contact.company||contact.name,contact.country,'','New','',contact.name,contact.email,contact.phone];values.forEach((value,i)=>{if(value)dialog.querySelector(`[name="field${i}"]`).value=value})}};
}render();
function recordDialog(){const importable=['Buyers','Suppliers'].includes(active);return `<div class="modalBackdrop"><div class="modal" id="recordDialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><h2 id="dialogTitle">${editRecordIndex>=0?'Edit':'Add'} ${escapeHTML(active)} record</h2><p>Saved only in this browser. This public prototype has no account sync.</p>${importable?`<div class="importBox"><label for="googleCsv">Import Google or Gmail contacts (Google CSV)</label><input id="googleCsv" type="file" accept=".csv,text/csv"><small>Export contacts as Google CSV from contacts.google.com. The file stays in this browser; select a contact to autofill one entry.</small>${importMessage?`<p role="status">${escapeHTML(importMessage)}</p>`:''}${importedContacts.length?`<label for="contactPicker">Autofill from contact</label><select id="contactPicker"><option value="">Choose a contact</option>${importedContacts.map((c,i)=>`<option value="${i}">${escapeHTML([c.name,c.company,c.email].filter(Boolean).join(' · '))}</option>`).join('')}</select>`:''}</div>`:''}<form>${data[active][0].map((h,i)=>`<label>${escapeHTML(h)}<input name="field${i}" value="${escapeHTML(editRecordIndex>=0?data[active][1][editRecordIndex][i]||'':'')}" ${/latitude|longitude/i.test(h)?`type="number" step="any" ${/latitude/i.test(h)?'min="-90" max="90"':'min="-180" max="180"'}`:'type="text"'} ${i===0?'required':''} maxlength="150"></label>`).join('')}<div class="modalActions"><button type="button" class="ghost" data-cancel>Cancel</button><button type="submit">${editRecordIndex>=0?'Save changes':'Save record'}</button></div></form></div></div>`}
